name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend safety tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: findgrinds_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/findgrinds_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Safety-path tests (age gate, parent linking, report dedup, disputes, refunds, screening)
        run: npm test
      - name: Safety-ops SQL views apply cleanly
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: node scripts/apply-safety-views.js

  screening-service:
    name: Message screening service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: screening-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: screening-service/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit tests + precision/recall floor
        run: pytest -q
      - name: Evaluation report
        run: python evaluate.py
      - uses: actions/upload-artifact@v4
        with:
          name: screening-eval
          path: screening-service/EVAL.md

  ai-evals:
    name: AI assistant evals
    runs-on: ubuntu-latest
    needs: backend
    # Secrets are unavailable to PRs from forks; the step below skips cleanly in that case.
    env:
      ANTHROPIC_API_KEY_FINDGRINDS: ${{ secrets.ANTHROPIC_API_KEY_FINDGRINDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run adversarial eval cases
        run: |
          if [ -z "$ANTHROPIC_API_KEY_FINDGRINDS" ]; then
            echo "::warning::ANTHROPIC_API_KEY_FINDGRINDS not set; AI evals skipped"
          fi
          npm run test:evals
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-eval-transcripts
          path: evals/ai-assistant/last-run.json
          if-no-files-found: ignore
