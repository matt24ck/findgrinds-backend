[project]
name = "findgrinds-screening"
version = "2026.9.1"
description = "Off-platform contact solicitation detector for FindGrinds tutor-to-minor messages"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the service root on sys.path so `from screening...` resolves under plain `pytest`.
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["screening"]
